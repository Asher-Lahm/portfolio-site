<svg xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="headerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2949b3"/>
            <stop offset="100%" stop-color="#2e62c2"/>
        </linearGradient>
    </defs>
    <symbol id="wave" viewBox="0 0 1000 100">
        <path d="M0,50 C200,0 300,99 500,99 C700,99 800,0 1000,50 L1000,100 L0,100 Z" />
    </symbol>

    <symbol id="waveU" viewBox="0 0 1000 100">
        <path d="M0,50 C200,100 300,1 500,1 C700,1 800,100 1000,50 L1000,0 L0,0 Z" />
    </symbol>

    <symbol id="header-wave" viewBox="0 0 1000 100">
        
        <path d="M0,50 C200,100 300,1 500,1 C700,1 800,100 1000,50 L1000,0 L0,0 Z" 
        fill="url(#headerGradient)"
        />
    </symbol>
</svg>